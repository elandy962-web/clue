<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content5="width=device-width, initial-scale=1.0">
  <title>Clue - Edición Clásica en Español</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .main-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Tablero de Clue basado en CSS Grid de 10x10 */
    .tablero {
      display: grid;
      grid-template-columns: repeat(10, 50px);
      grid-template-rows: repeat(10, 50px);
      gap: 3px;
      background-color: #1e293b;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Celdas estándar del pasillo o casillas normales */
    .celda {
      background-color: #334155;
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #cbd5e1;
      border-radius: 4px;
    }

    /* Habitaciones de las esquinas transformadas en UN SOLO CUADRO GRANDE (bloque continuo de 2x2 celdas) */
    .habitacion-esquina {
      background-color: #1e293b;
      border: 2px solid #ef4444;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      color: #f8fafc;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    /* Posicionamiento exacto de las esquinas en el grid de 10x10 */
    .estudio { grid-area: 1 / 1 / span 2 / span 2; }
    .vestibulo { grid-area: 1 / 5 / span 2 / span 2; }
    .salon { grid-area: 1 / 9 / span 2 / span 2; }
    .biblioteca { grid-area: 5 / 1 / span 2 / span 2; }
    .comedor { grid-area: 5 / 9 / span 2 / span 2; }
    .billar { grid-area: 9 / 1 / span 2 / span 2; }
    .invernadero { grid-area: 9 / 8 / span 2 / span 2; }

    /* Habitaciones centrales u otros elementos decorativos */
    .centro-mansion {
      grid-area: 4 / 4 / span 4 / span 4;
      background-color: #020617;
      border: 2px solid #a855f7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #c084fc;
    }

    /* Panel derecho de controles, jugadores y acciones */
    .panel-derecho {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 320px;
    }

    .card-panel {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
    }

    .card-panel h3 {
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .btn-tirar { background-color: #f59e0b; }
    .btn-libreta { background-color: #3b82f6; }
    .btn-acusar { background-color: #a855f7; }
    .btn-salir { background-color: #ef4444; }
  </style>
</head>
<body>

  <h1>Clue - Edición Clásica en Español (Tablero Ajustado)</h1>

  <div class="main-container">
    <!-- Tablero con esquinas unificadas -->
    <div class="tablero" id="tablero">
      <!-- Esquinas unificadas en un solo cuadro -->
      <div class="habitacion-esquina estudio">Estudio</div>
      <div class="habitacion-esquina vestibulo">Vestíbulo</div>
      <div class="habitacion-esquina salon">Salón</div>
      
      <div class="habitacion-esquina biblioteca">Biblioteca</div>
      <div class="centro-mansion">Centro (Mansión)</div>
      <div class="habitacion-esquina comedor">Comedor</div>
      
      <div class="habitacion-esquina billar">Billar</div>
      <div class="habitacion-esquina invernadero">Invernadero</div>
    </div>

    <!-- Panel lateral de acciones -->
    <div class="panel-derecho">
      <div class="card-panel">
        <h3>Jugadores en Sala</h3>
        <p>🟢 ASD (Cocina)</p>
      </div>

      <div class="card-panel">
        <h3>Tus Cartas</h3>
        <p style="font-size: 0.8rem; color: #94a3b8;">Sin cartas asignadas.</p>
      </div>

      <div class="card-panel">
        <h3>Registro de Sucesos</h3>
        <p style="font-size: 0.8rem; color: #38bdf8;">Partida iniciada. Sala: TWUTK1</p>
      </div>

      <div class="card-panel">
        <h3>Acciones</h3>
        <button class="btn btn-tirar">Tirar Dados</button>
        <button class="btn btn-libreta">Libreta</button>
        <button class="btn btn-acusar">Acusar</button>
        <button class="btn btn-salir">Salir</button>
      </div>
    </div>
  </div>

</body>
</html>
