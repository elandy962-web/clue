<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue - Juego de Deducción Multijugador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* ===== PANTALLA DE INICIO ===== */
        .login-screen {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            margin: 50px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-screen h2 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .room-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            width: 100%;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.9em;
            width: auto;
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-message.loading {
            background: #fff3cd;
            color: #856404;
        }

        .rooms-list {
            margin-top: 20px;
            text-align: left;
        }

        .rooms-list h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .room-item {
            background: #f9f9f9;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .room-item button {
            padding: 5px 10px;
            font-size: 0.85em;
        }

        /* ===== PANTALLA DEL JUEGO ===== */
        .game-container {
            display: none;
            grid-template-columns: 2fr 1.2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .game-container.active {
            display: grid;
        }

        .board-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .board-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 10px;
            border-radius: 10px;
        }

        .room-cell {
            background: #f5f5f5;
            border: 2px solid #999;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: bold;
            min-height: 80px;
            padding: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-cell:hover {
            background: #e8e8e8;
            transform: scale(1.05);
        }

        .room-cell.current-room {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h3 {
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .player-info {
            padding: 8px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #ddd;
            font-size: 0.9em;
        }

        .player-info.current {
            background: #e8eaf6;
            border-left-color: #764ba2;
            font-weight: bold;
        }

        .player-info.eliminated {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .player-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .player-status {
            font-size: 0.8em;
            color: #666;
        }

        .cards-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
        }

        .card {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            line-height: 1.2;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card.suspect { border-color: #e74c3c; background: #fadbd8; }
        .card.weapon { border-color: #3498db; background: #d6eaf8; }
        .card.room { border-color: #27ae60; background: #d5f4e6; }

        .action-buttons {
            display: grid;
            gap: 8px;
            margin-top: 10px;
        }

        .message-log {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-size: 0.8em;
        }

        .message {
            padding: 5px;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .message.system {
            background: #e3f2fd;
            color: #1976d2;
            font-weight: bold;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .message.info {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .selection-group {
            margin-bottom: 15px;
        }

        .selection-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 0.95em;
        }

        .selection-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .room-code {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1em;
            color: #667eea;
        }

        .game-info {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        @media (max-width: 1024px) {
            .game-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .game-container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .cards-section {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Clue Multijugador</h1>
            <p>Juego de Deducción en Línea</p>
        </div>

        <!-- ===== PANTALLA DE INICIO ===== -->
        <div id="loginScreen" class="login-screen">
            <h2>Bienvenido</h2>
            
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Tu nombre (1-15 caracteres)" maxlength="15">
            </div>

            <div class="input-group">
                <input type="text" id="roomCode" placeholder="Código de sala (opcional)" maxlength="6">
            </div>

            <div class="room-selection">
                <button class="btn btn-primary" onclick="createNewRoom()">➕ Crear Sala</button>
                <button class="btn btn-secondary" onclick="joinExistingRoom()">🚪 Entrar</button>
            </div>

            <div id="statusMessage"></div>
            <div id="roomsList" class="rooms-list"></div>
        </div>

        <!-- ===== PANTALLA DEL JUEGO ===== -->
        <div id="gameScreen" class="game-container">
            <div>
                <div class="board-section">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h2>📍 Tablero</h2>
                        <div class="room-code" id="roomCodeDisplay"></div>
                    </div>

                    <div class="game-info">
                        <strong>Turno:</strong> <span id="currentTurnInfo">-</span>
                    </div>
                    
                    <div class="game-board" id="gameBoard"></div>
                </div>

                <div class="board-section" style="margin-top: 15px;">
                    <h2>🎴 Tus Cartas</h2>
                    <div class="cards-section" id="myCards"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <h3>👥 Jugadores</h3>
                    <div id="playersList"></div>
                    <button class="btn btn-secondary btn-small" style="margin-top: 10px; width: 100%;" onclick="leaveGame()">
                        🚪 Abandonar
                    </button>
                </div>

                <div class="panel">
                    <h3>⚙️ Acciones</h3>
                    <div class="action-buttons">
                        <button class="btn btn-primary btn-small" onclick="showAccusationModal()">
                            🎯 Acusación
                        </button>
                        <button class="btn btn-secondary btn-small" onclick="copyRoomCode()">
                            📋 Copiar Código
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <h3>💬 Mensajes</h3>
                    <div class="message-log" id="messageLog"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Acusación -->
    <div id="accusationModal" class="modal">
        <div class="modal-content">
            <h2>🔍 Hacer Acusación</h2>
            <p style="color: #666; margin-bottom: 15px;">Selecciona quién, con qué y dónde</p>
            
            <div class="selection-group">
                <label>Sospechoso:</label>
                <select id="suspectSelect">
                    <option value="">-- Selecciona --</option>
                    <option value="Miss Scarlett">Miss Scarlett</option>
                    <option value="Colonel Mustard">Colonel Mustard</option>
                    <option value="Mrs White">Mrs White</option>
                    <option value="Mr Green">Mr Green</option>
                    <option value="Mrs Peacock">Mrs Peacock</option>
                    <option value="Professor Plum">Professor Plum</option>
                </select>
            </div>

            <div class="selection-group">
                <label>Arma:</label>
                <select id="weaponSelect">
                    <option value="">-- Selecciona --</option>
                    <option value="Candlestick">Candelabro</option>
                    <option value="Knife">Cuchillo</option>
                    <option value="Lead Pipe">Tubo de Plomo</option>
                    <option value="Revolver">Revólver</option>
                    <option value="Rope">Cuerda</option>
                    <option value="Wrench">Llave Inglesa</option>
                </select>
            </div>

            <div class="selection-group">
                <label>Habitación:</label>
                <select id="roomSelect">
                    <option value="">-- Selecciona --</option>
                    <option value="Kitchen">Cocina</option>
                    <option value="Ballroom">Salón de Baile</option>
                    <option value="Conservatory">Conservatorio</option>
                    <option value="Dining Room">Comedor</option>
                    <option value="Billiard Room">Sala de Billar</option>
                    <option value="Library">Biblioteca</option>
                    <option value="Lounge">Salón</option>
                    <option value="Hall">Vestíbulo</option>
                    <option value="Study">Estudio</option>
                </select>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="submitAccusation()">✅ Acusar</button>
                <button class="btn btn-secondary" onclick="closeAccusationModal()">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase Corregidos (Versión 9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ===== CREDENCIALES DE FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyDWw0rXDYPuf6BsVUhEnj_ZFeiBCNaHVPw",
            authDomain: "clue-game-47c7e.firebaseapp.com",
            databaseURL: "https://clue-game-47c7e-default-rtdb.firebaseio.com",
            projectId: "clue-game-47c7e",
            storageBucket: "clue-game-47c7e.firebasestorage.app",
            messagingSenderId: "133188091784",
            appId: "1:133188091784:web:1d6c070ddc535951b0043d"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ===== CONSTANTES =====
        const SUSPECTS = ['Miss Scarlett', 'Colonel Mustard', 'Mrs White', 'Mr Green', 'Mrs Peacock', 'Professor Plum'];
        const WEAPONS = ['Candlestick', 'Knife', 'Lead Pipe', 'Revolver', 'Rope', 'Wrench'];
        const ROOMS = ['Kitchen', 'Ballroom', 'Conservatory', 'Dining Room', 'Billiard Room', 'Library', 'Lounge', 'Hall', 'Study'];

        // ===== ESTADO DEL JUEGO =====
        let gameState = {
            userId: null,
            playerName: '',
            roomCode: '',
            players: {},
            myCards: [],
            currentPlayer: null,
            gameStarted: false,
            mystery: {}
        };

        // ===== AUTENTICACIÓN =====
        async function authenticateUser() {
            try {
                const result = await auth.signInAnonymously();
                gameState.userId = result.user.uid;
                showStatus('✅ Conectado a Firebase', 'success');
                setTimeout(() => {
                    document.getElementById('statusMessage').innerHTML = '';
                    loadPublicRooms();
                }, 1000);
            } catch (error) {
                showStatus('❌ Error de conexión: ' + error.message, 'error');
            }
        }

        // ===== FUNCIONES DE INTERFAZ =====
        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = 'status-message ' + type;
            statusDiv.textContent = message;
        }

        async function createNewRoom() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                showStatus('❌ Ingresa tu nombre', 'error');
                return;
            }

            gameState.playerName = name;
            gameState.roomCode = Math.random().toString(36).substr(2, 6).toUpperCase();

            showStatus('⏳ Creando sala...', 'loading');

            try {
                const roomData = {
                    host: gameState.userId,
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    status: 'waiting',
                    players: {
                        [gameState.userId]: {
                            name: gameState.playerName,
                            suspect: '',
                            ready: false,
                            cards: []
                        }
                    },
                    gameState: {
                        currentPlayer: 0,
                        turn: 0,
                        messages: []
                    }
                };

                await database.ref(`rooms/${gameState.roomCode}`).set(roomData);
                startGame();
            } catch (error) {
                showStatus('❌ Error al crear sala: ' + error.message, 'error');
            }
        }

        async function joinExistingRoom() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCode').value.trim().toUpperCase();

            if (!name || !code) {
                showStatus('❌ Ingresa nombre y código', 'error');
                return;
            }

            gameState.playerName = name;
            gameState.roomCode = code;

            showStatus('⏳ Conectando a sala...', 'loading');

            try {
                const roomSnapshot = await database.ref(`rooms/${code}`).get();
                
                if (!roomSnapshot.exists()) {
                    showStatus('❌ Sala no encontrada', 'error');
                    return;
                }

                await database.ref(`rooms/${code}/players/${gameState.userId}`).set({
                    name: gameState.playerName,
                    suspect: '',
                    ready: false,
                    cards: []
                });

                startGame();
            } catch (error) {
                showStatus('❌ Error al entrar: ' + error.message, 'error');
            }
        }

        function loadPublicRooms() {
            database.ref('rooms').on('value', (snapshot) => {
                const roomsList = document.getElementById('roomsList');
                const data = snapshot.val();

                if (!data) {
                    roomsList.innerHTML = '<p style="color: #999;">No hay salas disponibles</p>';
                    return;
                }

                let html = '<h3>📋 Salas Disponibles:</h3>';
                const entries = Object.entries(data).slice(-5); // Mostrar últimas 5 salas
                entries.forEach(([code, room]) => {
                    const playerCount = Object.keys(room.players || {}).length;
                    html += `
                        <div class="room-item">
                            <div>
                                <strong>${code}</strong> - ${playerCount} jugador(es)
                            </div>
                            <button class="btn btn-secondary btn-small" onclick="setRoomCode('${code}')">
                                Entrar
                            </button>
                        </div>
                    `;
                });
                roomsList.innerHTML = html;
            });
        }

        function setRoomCode(code) {
            document.getElementById('roomCode').value = code;
        }

        function startGame() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('roomCodeDisplay').textContent = gameState.roomCode;

            setupGameListeners();
            addMessage('system', `¡Bienvenido! Código de sala: ${gameState.roomCode}`);
        }

        function setupGameListeners() {
            database.ref(`rooms/${gameState.roomCode}/players`).on('value', (snapshot) => {
                gameState.players = snapshot.val() || {};
                updatePlayersList();
                
                if (Object.keys(gameState.players).length >= 1 && !gameState.mystery.suspect) {
                    // Inicializar el misterio si es el host o si aún no está creado
                    database.ref(`rooms/${gameState.roomCode}/mystery`).get().then((snap) => {
                        if (!snap.exists()) {
                            initializeMystery();
                        } else {
                            gameState.mystery = snap.val();
                            updateGameBoard();
                        }
                    });
                }
            });

            database.ref(`rooms/${gameState.roomCode}/mystery`).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    gameState.mystery = snapshot.val();
                    updateGameBoard();
                }
            });

            database.ref(`rooms/${gameState.roomCode}/gameState`).on('value', (snapshot) => {
                const state = snapshot.val();
                if (state) {
                    gameState.currentPlayer = state.currentPlayer;
                    updateCurrentTurn();
                }
            });

            database.ref(`rooms/${gameState.roomCode}/gameState/messages`).on('child_added', (snapshot) => {
                const message = snapshot.val();
                if(message) addMessage(message.type, message.text);
            });
        }

        function initializeMystery() {
            const mystery = {
                suspect: SUSPECTS[Math.floor(Math.random() * SUSPECTS.length)],
                weapon: WEAPONS[Math.floor(Math.random() * WEAPONS.length)],
                room: ROOMS[Math.floor(Math.random() * ROOMS.length)]
            };

            database.ref(`rooms/${gameState.roomCode}/mystery`).set(mystery);
            distributeCards(mystery);
            addMessage('system', '¡La partida ha comenzado! 🎮');
        }

        function distributeCards(mystery) {
            const allCards = [...SUSPECTS, ...WEAPONS, ...ROOMS];
            const shuffled = allCards.sort(() => Math.random() - 0.5);
            
            const playerIds = Object.keys(gameState.players);
            const cardsPerPlayer = Math.floor((allCards.length - 3) / playerIds.length);

            playerIds.forEach((playerId, index) => {
                const playerCards = shuffled.slice(index * cardsPerPlayer, (index + 1) * cardsPerPlayer);
                const filteredCards = playerCards.filter(card => 
                    card !== mystery.suspect &&
                    card !== mystery.weapon &&
                    card !== mystery.room
                );

                database.ref(`rooms/${gameState.roomCode}/players/${playerId}/cards`).set(filteredCards);

                if (playerId === gameState.userId) {
                    gameState.myCards = filteredCards;
                    updateMyCards();
                }
            });
        }

        function updateGameBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = ROOMS.map(room => `
                <div class="room-cell ${room === gameState.mystery.room ? 'current-room' : ''}">
                    ${room}
                </div>
            `).join('');
        }

        function updatePlayersList() {
            const list = document.getElementById('playersList');
            const playerIds = Object.keys(gameState.players);
            
            list.innerHTML = playerIds.map((id, idx) => {
                const player = gameState.players[id] || {};
                return `
                    <div class="player-info ${idx === gameState.currentPlayer ? 'current' : ''}">
                        <div class="player-name">
                            ${idx === gameState.currentPlayer ? '▶ ' : ''}${player.name || 'Jugador'}
                        </div>
                        <div class="player-status">
                            🎴 ${player.cards ? player.cards.length : 0} cartas
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateMyCards() {
            const cardsDiv = document.getElementById('myCards');
            
            database.ref(`rooms/${gameState.roomCode}/players/${gameState.userId}/cards`).on('value', (snapshot) => {
                gameState.myCards = snapshot.val() || [];
                if (gameState.myCards.length === 0) {
                    cardsDiv.innerHTML = '<p style="color: #999;">Esperando cartas...</p>';
                    return;
                }

                cardsDiv.innerHTML = gameState.myCards.map(card => {
                    let type = SUSPECTS.includes(card) ? 'suspect' : WEAPONS.includes(card) ? 'weapon' : 'room';
                    return `<div class="card ${type}">${card}</div>`;
                }).join('');
            });
        }

        function updateCurrentTurn() {
            const playerIds = Object.keys(gameState.players);
            if (playerIds.length > 0 && gameState.currentPlayer !== null) {
                const currentPlayerName = gameState.players[playerIds[gameState.currentPlayer]]?.name || 'Esperando...';
                document.getElementById('currentTurnInfo').textContent = currentPlayerName;
            }
        }

        function showAccusationModal() {
            document.getElementById('accusationModal').classList.add('active');
        }

        function closeAccusationModal() {
            document.getElementById('accusationModal').classList.remove('active');
        }

        function submitAccusation() {
            const suspect = document.getElementById('suspectSelect').value;
            const weapon = document.getElementById('weaponSelect').value;
            const room = document.getElementById('roomSelect').value;

            if (!suspect || !weapon || !room) {
                addMessage('error', '❌ Completa todos los campos');
                return;
            }

            const isCorrect = suspect === gameState.mystery.suspect &&
                            weapon === gameState.mystery.weapon &&
                            room === gameState.mystery.room;

            const message = isCorrect 
                ? `✅ ¡${gameState.playerName} acertó! Era ${suspect} con ${weapon} en ${room}`
                : `❌ ${gameState.playerName} falló la acusación`;

            saveMessage(isCorrect ? 'success' : 'error', message);
            closeAccusationModal();
        }

        function saveMessage(type, text) {
            const messagesRef = database.ref(`rooms/${gameState.roomCode}/gameState/messages`);
            messagesRef.push({
                type: type,
                text: text,
                sender: gameState.playerName,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function addMessage(type, text) {
            const log = document.getElementById('messageLog');
            if(!log) return;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            log.appendChild(msgDiv);
            log.scrollTop = log.scrollHeight;
        }

        function copyRoomCode() {
            navigator.clipboard.writeText(gameState.roomCode);
            addMessage('info', '📋 Código copiado: ' + gameState.roomCode);
        }

        function leaveGame() {
            if (confirm('¿Seguro que quieres abandonar?')) {
                database.ref(`rooms/${gameState.roomCode}/players/${gameState.userId}`).remove();
                location.reload();
            }
        }

        // ===== INICIALIZAR =====
        authenticateUser();
    </script>
</body>
</html>
