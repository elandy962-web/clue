<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clue - Edición Clásica en Español</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #12141d;
            min-height: 100vh;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .header {
            text-align: center;
            color: white;
            padding: 4px 0;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2rem;
            color: #f6ad55;
        }

        .header p {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        /* PANTALLA DE LOGIN */
        .login-screen {
            background: #1a202c;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #2d3748;
            width: 90%;
        }

        .login-screen h2 {
            color: #f6ad55;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #4a5568;
            background: #111827;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }

        .room-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .btn {
            padding: 12px;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary { background: #dd6b20; color: white; width: 100%; }
        .btn-primary:hover { background: #ed8936; }
        .btn-secondary { background: #2b6cb0; color: white; width: 100%; }
        .btn-secondary:hover { background: #3182ce; }
        .btn-small { padding: 8px 12px; font-size: 0.85rem; width: auto; }
        .btn:disabled { background: #2d3748 !important; color: #718096 !important; cursor: not-allowed; }

        .status-message {
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-message.error { background: #742a2a; color: #fed7d7; }
        .status-message.success { background: #22543d; color: #c6f6d5; }
        .status-message.loading { background: #744210; color: #feebc8; }

        .rooms-list {
            margin-top: 10px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        .room-item {
            background: #111827;
            padding: 12px;
            margin: 6px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-left: 4px solid #dd6b20;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .room-item:hover {
            background: #1a2332;
        }

        .room-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .room-name {
            font-weight: bold;
            color: #f6ad55;
            font-size: 1rem;
        }

        .room-details {
            font-size: 0.8rem;
            color: #cbd5e0;
        }

        .room-participants {
            font-size: 0.75rem;
            color: #a0aec0;
            max-height: 60px;
            overflow-y: auto;
            margin-top: 4px;
        }

        .participant-badge {
            display: inline-block;
            background: #2b6cb0;
            padding: 2px 8px;
            border-radius: 12px;
            margin-right: 4px;
            margin-bottom: 2px;
            font-size: 0.75rem;
        }

        /* JUEGO PRINCIPAL ADAPTABLE */
        .game-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .game-container.active {
            display: flex;
        }

        @media (min-width: 900px) {
            .game-container {
                display: none;
                grid-template-columns: 1.3fr 1fr;
                align-items: start;
            }
            .game-container.active {
                display: grid;
            }
        }

        .board-section {
            background: #0d1b1e;
            border-radius: 12px;
            padding: 8px;
            border: 2px solid #2d3748;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            width: 100%;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .board-header h2 {
            color: #f6ad55;
            font-size: 1rem;
        }

        .game-info {
            background: rgba(26, 32, 44, 0.95);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #4a5568;
        }

        .dice-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f6ad55;
            background: #111827;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #4a5568;
        }

        /* TABLERO CLUE 10x10 */
        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            aspect-ratio: 1;
            margin-bottom: 6px;
        }

        .cell {
            background: #0a0e16;
            border: 1px solid #2d3748;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 20px;
        }

        .cell:hover { background: #1a2332; }
        .cell.room { background: #1e3a5f; border-color: #3182ce; }
        .cell.hallway { background: #111827; }

        .pawn {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: bold;
            color: white;
        }

        /* PANEL DERECHO */
        .right-panel {
            background: #1a202c;
            border-radius: 12px;
            padding: 10px;
            border: 2px solid #2d3748;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 600px;
        }

        .panel-section {
            background: #111827;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #4a5568;
        }

        .panel-section h3 {
            color: #f6ad55;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-item {
            background: #0d1b1e;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #dd6b20;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: bold;
            color: #e2e8f0;
        }

        .player-status {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .card {
            background: linear-gradient(135deg, #dd6b20, #ed8936);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 2px;
            display: inline-block;
            border: 1px solid #f6ad55;
        }

        .card.suspect { background: #2b6cb0; border-color: #3182ce; }
        .card.weapon { background: #742a2a; border-color: #fc8181; }
        .card.room { background: #22543d; border-color: #9ae6b4; }

        .detective-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .detective-table th, .detective-table td {
            border: 1px solid #4a5568;
            padding: 4px;
            text-align: left;
        }

        .detective-table th { background: #2d3748; color: #f6ad55; }
        .detective-table input { width: 16px; height: 16px; cursor: pointer; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a202c;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #2d3748;
        }

        .modal-content h2 {
            color: #f6ad55;
            margin-bottom: 15px;
        }

        .modal-content select, .modal-content input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #111827;
            border: 1px solid #4a5568;
            color: white;
            border-radius: 6px;
        }

        .message-log {
            background: #111827;
            border: 1px solid #4a5568;
            border-radius: 6px;
            padding: 6px;
            height: 100px;
            overflow-y: auto;
            font-size: 0.75rem;
        }

        .message {
            margin: 2px 0;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .message.error { background: #742a2a; color: #fed7d7; }
        .message.success { background: #22543d; color: #c6f6d5; }
        .message.info { background: #2b6cb0; color: #bee3f8; }

        .mobile-controls {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 6px 10px;
            font-size: 0.8rem;
            background: #dd6b20;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }

        .btn-action:hover { background: #ed8936; }
        .btn-action:disabled { background: #2d3748; color: #718096; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 CLUE - Juego de Misterio</h1>
        <p>Edición Clásica Multijugador en Línea</p>
    </div>

    <div class="container">
        <!-- PANTALLA DE LOGIN -->
        <div id="loginScreen" class="login-screen">
            <h2>Ingresa al Juego</h2>
            
            <div class="input-group">
                <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="20">
            </div>

            <div class="room-selection">
                <button class="btn btn-primary" onclick="createNewRoom()">➕ Crear Sala</button>
                <button class="btn btn-secondary" onclick="toggleRoomsList()">📋 Ver Salas</button>
            </div>

            <div id="roomNameInput" style="display: none; margin-bottom: 10px;">
                <input type="text" id="newRoomName" placeholder="Nombre de la sala" maxlength="30">
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <button class="btn btn-primary" onclick="confirmCreateRoom()" style="flex: 1;">Crear</button>
                    <button class="btn btn-secondary" onclick="toggleRoomsList()" style="flex: 1;">Cancelar</button>
                </div>
            </div>

            <div id="roomsList" class="rooms-list"></div>
            <div id="statusMessage" class="status-message" style="display: none;"></div>
        </div>

        <!-- JUEGO PRINCIPAL -->
        <div id="gameContainer" class="game-container">
            <!-- SECCIÓN DEL TABLERO -->
            <div class="board-section">
                <div class="board-header">
                    <h2>🏠 Tablero de Juego</h2>
                    <div class="dice-display" id="diceDisplay">🎲 Dados</div>
                </div>

                <div class="game-info">
                    <span>Sala: <strong id="roomNameDisplay"></strong></span>
                    <span id="turnInfo">Turno: <strong id="currentPlayer"></strong></span>
                </div>

                <div class="board" id="gameBoard"></div>

                <div class="mobile-controls">
                    <button class="btn-action" onclick="rollDice()" id="diceBtn">🎲 Dados</button>
                    <button class="btn-action" onclick="showSuggestionModal()" id="suggestionBtn">❓ Pregunta</button>
                    <button class="btn-action" onclick="showAccusationModal()" id="accusationBtn">🎯 Acusación</button>
                    <button class="btn-action" onclick="showNotebookModal()" id="notebookBtn">📓 Libreta</button>
                    <button class="btn-action" onclick="leaveGame()">❌ Salir</button>
                </div>
            </div>

            <!-- PANEL DERECHO -->
            <div class="right-panel">
                <!-- JUGADORES -->
                <div class="panel-section">
                    <h3>👥 Participantes en la Sala</h3>
                    <div class="players-list" id="playersList"></div>
                </div>

                <!-- MIS CARTAS -->
                <div class="panel-section">
                    <h3>🎴 Mis Cartas</h3>
                    <div id="myCards"></div>
                </div>

                <!-- LOG DE MENSAJES -->
                <div class="panel-section">
                    <h3>💬 Evento</h3>
                    <div class="message-log" id="messageLog"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALES -->
    <div id="suggestionModal" class="modal">
        <div class="modal-content">
            <h2>❓ Hacer una Pregunta</h2>
            <label>Sospechoso:</label>
            <select id="sugSuspectSelect"></select>
            <label>Arma:</label>
            <select id="sugWeaponSelect"></select>
            <label>Habitación:</label>
            <input type="text" id="sugRoomInput" readonly>
            <button class="btn btn-primary" onclick="submitSuggestion()">Enviar Pregunta</button>
            <button class="btn btn-secondary" onclick="closeSuggestionModal()">Cancelar</button>
        </div>
    </div>

    <div id="replySuggestionModal" class="modal">
        <div class="modal-content">
            <h2>👁️ Mostrar Carta en Privado</h2>
            <label>Selecciona una carta:</label>
            <select id="matchingCardsSelect"></select>
            <button class="btn btn-primary" onclick="confirmReplySuggestion()">Confirmar</button>
        </div>
    </div>

    <div id="accusationModal" class="modal">
        <div class="modal-content">
            <h2>🎯 Hacer Acusación Final</h2>
            <label>Sospechoso:</label>
            <select id="suspectSelect"></select>
            <label>Arma:</label>
            <select id="weaponSelect"></select>
            <label>Habitación:</label>
            <select id="roomSelect"></select>
            <button class="btn btn-primary" onclick="submitAccusation()">Acusar</button>
            <button class="btn btn-secondary" onclick="closeAccusationModal()">Cancelar</button>
        </div>
    </div>

    <div id="notebookModal" class="modal">
        <div class="modal-content">
            <h2>📓 Libreta de Detective</h2>
            <div id="notebookContainer"></div>
            <button class="btn btn-secondary" onclick="closeNotebookModal()" style="width: 100%; margin-top: 10px;">Cerrar</button>
        </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

    <script>
        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBUoyiPMPm2jZ5yFpPb5_DXQMK3u_S6Fc0",
            authDomain: "clue-game-c7b1f.firebaseapp.com",
            databaseURL: "https://clue-game-c7b1f-default-rtdb.firebaseio.com",
            projectId: "clue-game-c7b1f",
            storageBucket: "clue-game-c7b1f.appspot.com",
            messagingSenderId: "654944197903",
            appId: "1:654944197903:web:0b8b3f94d5b20302ac4f6a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const SUSPECTS = ['Miss Scarlet', 'Professor Plum', 'Mrs. White', 'Mr. Green', 'Mrs. Peacock', 'Colonel Mustard'];
        const WEAPONS = ['Candlestick', 'Knife', 'Lead Pipe', 'Revolver', 'Rope', 'Wrench'];
        const ROOMS = ['Hallway', 'Study', 'Hall', 'Lounge', 'Kitchen', 'Ballroom', 'Conservatory', 'Billiard', 'Library'];
        const uniqueRoomsList = [...new Set(ROOMS)];

        let gameState = {
            userId: null,
            playerName: '',
            roomCode: null,
            roomName: '',
            currentIndex: 0,
            myLocation: 'Centro',
            myCards: [],
            notebookMarks: {},
            players: {},
            activeSuggestion: null,
            diceResult: 0,
            mystery: null
        };

        let currentRooms = {};

        async function authenticateUser() {
            try {
                const user = await auth.signInAnonymously();
                gameState.userId = user.user.uid;
                console.log('Usuario autenticado:', gameState.userId);
            } catch (error) {
                console.error('Error en autenticación:', error);
            }
        }

        function toggleRoomsList() {
            const input = document.getElementById('roomNameInput');
            const list = document.getElementById('roomsList');
            
            if (input.style.display === 'none') {
                input.style.display = 'block';
                list.style.display = 'none';
                document.getElementById('newRoomName').focus();
            } else {
                input.style.display = 'none';
                loadAvailableRooms();
                list.style.display = 'block';
            }
        }

        function createNewRoom() {
            toggleRoomsList();
        }

        async function confirmCreateRoom() {
            const playerName = document.getElementById('playerNameInput').value.trim();
            const roomName = document.getElementById('newRoomName').value.trim();

            if (!playerName || playerName.length === 0) {
                showStatus('error', '❌ Ingresa tu nombre');
                return;
            }
            if (!roomName || roomName.length === 0) {
                showStatus('error', '❌ Ingresa nombre de la sala');
                return;
            }

            gameState.playerName = playerName;
            const roomCode = Math.random().toString(36).substr(2, 9).toUpperCase();
            gameState.roomCode = roomCode;
            gameState.roomName = roomName;

            try {
                showStatus('loading', '⏳ Creando sala...');
                
                // Crear estructura de la sala
                await database.ref(`rooms/${roomCode}`).set({
                    roomCode: roomCode,
                    roomName: roomName,
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    players: {
                        [gameState.userId]: {
                            name: playerName,
                            color: SUSPECTS[0],
                            joinedAt: firebase.database.ServerValue.TIMESTAMP
                        }
                    },
                    gameState: {
                        currentTurn: gameState.userId,
                        turnIndex: 0,
                        messages: {}
                    },
                    mystery: generateMystery()
                });

                gameState.players[gameState.userId] = {
                    name: playerName,
                    color: SUSPECTS[0]
                };

                startGameListeners();
            } catch (error) {
                showStatus('error', '❌ Error al crear sala: ' + error.message);
            }
        }

        async function loadAvailableRooms() {
            try {
                const snapshot = await database.ref('rooms').get();
                currentRooms = snapshot.val() || {};
                displayAvailableRooms();
            } catch (error) {
                showStatus('error', '❌ Error al cargar salas');
            }
        }

        function displayAvailableRooms() {
            const list = document.getElementById('roomsList');
            const rooms = Object.values(currentRooms);

            if (rooms.length === 0) {
                list.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">No hay salas disponibles</p>';
                return;
            }

            list.innerHTML = rooms.map(room => {
                const playerCount = room.players ? Object.keys(room.players).length : 0;
                const players = room.players || {};
                const playerNames = Object.values(players)
                    .map(p => p.name)
                    .join(', ');

                return `
                    <div class="room-item" onclick="joinRoom('${room.roomCode}', '${room.roomName}')">
                        <div class="room-info">
                            <div class="room-name">🏠 ${room.roomName}</div>
                            <div class="room-details">
                                Código: ${room.roomCode} | Jugadores: ${playerCount}/6
                            </div>
                            <div class="room-participants">
                                <strong>Participantes:</strong><br>
                                ${playerNames || 'Esperando jugadores...'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function joinRoom(roomCode, roomName) {
            const playerName = document.getElementById('playerNameInput').value.trim();

            if (!playerName) {
                showStatus('error', '❌ Ingresa tu nombre');
                return;
            }

            gameState.playerName = playerName;
            gameState.roomCode = roomCode;
            gameState.roomName = roomName;

            try {
                showStatus('loading', '⏳ Uniéndose a la sala...');
                
                // Agregar jugador a la sala
                await database.ref(`rooms/${roomCode}/players/${gameState.userId}`).set({
                    name: playerName,
                    color: SUSPECTS[Object.keys(currentRooms[roomCode].players || {}).length % SUSPECTS.length],
                    joinedAt: firebase.database.ServerValue.TIMESTAMP
                });

                startGameListeners();
            } catch (error) {
                showStatus('error', '❌ Error al unirse: ' + error.message);
            }
        }

        function startGameListeners() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameContainer').classList.add('active');

            // Mostrar datos de la sala
            document.getElementById('roomNameDisplay').textContent = gameState.roomName;

            // Escuchar cambios en jugadores
            database.ref(`rooms/${gameState.roomCode}/players`).on('value', (snapshot) => {
                gameState.players = snapshot.val() || {};
                updatePlayersList();
            });

            // Escuchar turno actual
            database.ref(`rooms/${gameState.roomCode}/gameState/currentTurn`).on('value', (snapshot) => {
                const currentUserId = snapshot.val();
                if (currentUserId) {
                    const currentPlayer = gameState.players[currentUserId]?.name || 'Desconocido';
                    document.getElementById('currentPlayer').textContent = currentPlayer;
                }
            });

            // Escuchar mensajes
            database.ref(`rooms/${gameState.roomCode}/gameState/messages`).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                if (msg) {
                    addMessage(msg.type, msg.text);
                }
            });

            // Dibujar tablero
            drawBoard();
            updateMyCards();
            buildNotebookUI();
        }

        function updatePlayersList() {
            const list = document.getElementById('playersList');
            list.innerHTML = Object.entries(gameState.players)
                .map(([id, player]) => {
                    const isCurrent = id === Object.keys(gameState.players)[gameState.currentIndex];
                    return `
                        <div class="player-item">
                            <div>
                                <div class="player-name">👤 ${player.name}</div>
                                <div class="player-status">${player.color}</div>
                            </div>
                            ${isCurrent ? '⭐' : ''}
                        </div>
                    `;
                })
                .join('');
        }

        function generateMystery() {
            return {
                suspect: SUSPECTS[Math.floor(Math.random() * SUSPECTS.length)],
                weapon: WEAPONS[Math.floor(Math.random() * WEAPONS.length)],
                room: ROOMS[Math.floor(Math.random() * ROOMS.length)]
            };
        }

        function drawBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell room';
                cell.textContent = i;
                board.appendChild(cell);
            }
        }

        function updateMyCards() {
            // Implementar lógica para mostrar mis cartas
            const cardsDiv = document.getElementById('myCards');
            cardsDiv.innerHTML = '<p style="color: #888; font-size: 0.8rem;">Esperando distribuición...</p>';
        }

        function buildNotebookUI() {
            const container = document.getElementById('notebookContainer');
            let html = `
                <table class="detective-table">
                    <tr><th>Sospechosos</th><th>✓</th></tr>
                    ${SUSPECTS.map(s => `<tr><td>${s}</td><td><input type="checkbox" onchange="toggleNotebook('${s}', this.checked)"></td></tr>`).join('')}
                </table>
                <table class="detective-table" style="margin-top: 8px;">
                    <tr><th>Armas</th><th>✓</th></tr>
                    ${WEAPONS.map(w => `<tr><td>${w}</td><td><input type="checkbox" onchange="toggleNotebook('${w}', this.checked)"></td></tr>`).join('')}
                </table>
                <table class="detective-table" style="margin-top: 8px;">
                    <tr><th>Habitaciones</th><th>✓</th></tr>
                    ${uniqueRoomsList.map(r => `<tr><td>${r}</td><td><input type="checkbox" onchange="toggleNotebook('${r}', this.checked)"></td></tr>`).join('')}
                </table>
            `;
            container.innerHTML = html;
        }

        function toggleNotebook(item, isChecked) {
            gameState.notebookMarks[item] = isChecked;
        }

        function rollDice() {
            gameState.diceResult = Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceDisplay').textContent = `🎲 ${gameState.diceResult}`;
            addMessage('info', `🎲 Se lanzaron los dados: ${gameState.diceResult}`);
        }

        function showNotebookModal() { document.getElementById('notebookModal').classList.add('active'); }
        function closeNotebookModal() { document.getElementById('notebookModal').classList.remove('active'); }

        function showSuggestionModal() {
            document.getElementById('suggestionModal').classList.add('active');
        }

        function closeSuggestionModal() { document.getElementById('suggestionModal').classList.remove('active'); }

        async function submitSuggestion() {
            const suspect = document.getElementById('sugSuspectSelect').value;
            const weapon = document.getElementById('sugWeaponSelect').value;
            const room = document.getElementById('sugRoomInput').value;

            if (!suspect || !weapon) {
                addMessage('error', '❌ Completa los campos');
                return;
            }

            closeSuggestionModal();
            addMessage('success', `❓ ${gameState.playerName} pregunta: [${suspect} | ${weapon}]`);
        }

        function showAccusationModal() {
            document.getElementById('accusationModal').classList.add('active');
        }

        function closeAccusationModal() { document.getElementById('accusationModal').classList.remove('active'); }

        async function submitAccusation() {
            const suspect = document.getElementById('suspectSelect').value;
            const weapon = document.getElementById('weaponSelect').value;
            const room = document.getElementById('roomSelect').value;

            if (!suspect || !weapon || !room) {
                addMessage('error', '❌ Completa todos los campos');
                return;
            }

            closeAccusationModal();
            addMessage('success', `🎯 ${gameState.playerName} acusa: [${suspect} | ${weapon} | ${room}]`);
        }

        function addMessage(type, text) {
            const log = document.getElementById('messageLog');
            if (!log) return;
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function showStatus(type, message) {
            const status = document.getElementById('statusMessage');
            status.className = `status-message ${type}`;
            status.textContent = message;
            status.style.display = 'block';
            if (type !== 'loading') {
                setTimeout(() => status.style.display = 'none', 3000);
            }
        }

        function leaveGame() {
            if (confirm('¿Deseas abandonar la partida?')) {
                if (gameState.roomCode) {
                    database.ref(`rooms/${gameState.roomCode}/players/${gameState.userId}`).remove();
                }
                location.reload();
            }
        }

        authenticateUser();
    </script>
</body>
</html>
